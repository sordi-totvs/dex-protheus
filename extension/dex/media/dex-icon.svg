    </linearGradient>
    <linearGradient id="omega" x1="38" y1="28" x2="90" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fee2e2"/>
      <stop offset="0.5" stop-color="#fca5a5"/>
